<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Finsa Maderas Ibéricas · Hablar con un asesor</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f1e9;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#2b2118}
  .c{max-width:420px;padding:32px 24px;text-align:center}
  h1{font-size:20px;margin:0 0 8px}
  p{font-size:15px;line-height:1.5;color:#5b4a3a;margin:0 0 20px}
  a{display:inline-block;background:#25d366;color:#fff;text-decoration:none;font-weight:600;padding:14px 22px;border-radius:999px}
</style>
</head>
<body>
<div class="c">
  <h1>Finsa Maderas Ibéricas</h1>
  <p id="m">Le estamos llevando al WhatsApp de su asesor…</p>
  <a id="b" href="https://wa.me/18099576500">Abrir WhatsApp</a>
</div>
<script>
  // Lleva al WhatsApp del asesor. Solo acepta un número (dígitos), así que no puede
  // redirigir a ningún otro sitio. Acepta ?n=18295591192 o ?n=18295591192?text=...
  (function () {
    var q = location.search.slice(1), n = '', t = 'Hola, vengo de una llamada con Lucy';
    var mN = q.match(/(?:^|&)n=(\d{8,15})/);
    if (mN) n = mN[1];
    var mT = q.match(/text=([^&]*)/);
    if (mT) { try { t = decodeURIComponent(mT[1].replace(/\+/g, ' ')); } catch (e) {} }
    var url = 'https://wa.me/' + (n || '18099576500') + '?text=' + encodeURIComponent(t);
    document.getElementById('b').href = url;
    location.replace(url);
  })();
</script>
</body>
</html>
